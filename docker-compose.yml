services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${SCORPANION_DB_NAME:-scorpanion}
      POSTGRES_USER: ${SCORPANION_DB_USERNAME:?SCORPANION_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${SCORPANION_DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SCORPANION_DB_USERNAME:-scorpanion} -d ${SCORPANION_DB_NAME:-scorpanion}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      SCORPANION_DB_URL: jdbc:postgresql://postgres:5432/${SCORPANION_DB_NAME:-scorpanion}
      SCORPANION_DB_USERNAME: ${SCORPANION_DB_USERNAME:?SCORPANION_DB_USERNAME is required}
      SCORPANION_DB_PASSWORD: ${SCORPANION_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SCORPANION_HTTP_PORT:-8080}:8080"

volumes:
  postgres_data:
